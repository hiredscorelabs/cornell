name: Cornell CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: make configure
    - name: Analysing the code with pylint
      run: |
        uv run pylint --rcfile=.pylintrc cornell tests
    - name: Unit Testig - pytest
      run: |
        uv run pytest

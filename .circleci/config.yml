version: 2.1
workflows:
  build_and_deploy:
    jobs:
      - test-flow:
          filters:
            tags:
              only: /.*/

jobs:
  test-flow:
    docker:
      - image: cimg/python:3.11.5
    steps:
      - checkout
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install dependencies
          command: |
            make configure
      - run:
          name: Run pylint
          command: |
            uv run pylint --rcfile=.pylintrc cornell tests
      - run:
          name: Run pytest
          command: |
            uv run pytest
